name: Fetch
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.x'}
    - run: pip install requests beautifulsoup4
    - run: python run.py
    - uses: actions/upload-artifact@v4
      with:
        name: dump
        path: dump
